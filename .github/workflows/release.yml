name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag matches build configuration
        shell: bash
        run: |
          VERSION=$(grep '^version' tdx.toml | cut -d'"' -f2)
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match tdx.toml version ${VERSION}" >&2
            exit 1
          fi

      - name: Build release artifacts with Dagger
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.9"
          call: release-artifacts --source=. export --path=release

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Install release-note dependencies
        run: pip install requests==2.34.2

      - name: Generate release notes
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CURRENT_TAG: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AI_MODEL: anthropic/claude-haiku-4.5
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          export PREV_TAG
          python3 .github/scripts/generate_release_notes.py > release_notes.md
          cat release_notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file release_notes.md

  update-homebrew:
    name: Update Homebrew Formula
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tdx repository
        uses: actions/checkout@v7.0.1
        with:
          path: tdx

      - name: Checkout homebrew-tap repository
        uses: actions/checkout@v7.0.1
        with:
          repository: niklas-heer/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Update Homebrew formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAP_REPO: ${{ github.workspace }}/homebrew-tap
        run: |
          cd tdx
          ./scripts/update-homebrew.sh "$VERSION"

      - name: Commit and push changes
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/tdx.rb
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update tdx to v${{ steps.version.outputs.version }}"
            git push
          fi

      - name: Create summary
        run: |
          {
          echo "## Homebrew Tap Updated"
          echo ""
          echo "Formula updated to version **v${{ steps.version.outputs.version }}**."
          echo ""
          echo '```bash'
          echo "brew upgrade niklas-heer/tap/tdx"
          echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
