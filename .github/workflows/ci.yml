name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  engine:
    name: Save engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Native save, history, recovery and race checks
        shell: bash
        run: go test -race -count=1 ./internal/saveprotocol ./internal/savesim ./internal/markdown ./internal/editor ./internal/versioning ./cmd/tdx-simulate
      - name: Deterministic replay and negative controls
        shell: bash
        run: |
          mkdir -p dist/go-engine
          go build -o dist/go-engine/tdx-simulate.exe ./cmd/tdx-simulate
          ./dist/go-engine/tdx-simulate.exe --runs 1000 --steps 200 --check --output dist/go-engine/report.json
          ./dist/go-engine/tdx-simulate.exe --seed 0 --trace dist/go-engine/seed-0.json
      - name: Retain engine evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: go-engine-${{ matrix.os }}
          path: dist/go-engine/*.json

  portable:
    name: Portable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - uses: jdx/mise-action@v4.3.0
      - name: Run portable CI
        run: mise run ci

  native:
    name: Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build native binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            go build -v -o tdx.exe ./cmd/tdx
          else
            go build -v -o tdx ./cmd/tdx
          fi

      - name: Run native filesystem tests
        run: go test -v ./internal/markdown ./internal/versioning

      - name: Test native binary execution
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./tdx.exe --version
          else
            ./tdx --version
          fi

  coverage-badge:
    name: Coverage badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: portable
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Generate coverage badge with Dagger
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.9"
          call: coverage-badge --source=. export --path=.github/badges/coverage.json

      - name: Commit coverage badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.json
          git diff --staged --quiet || git commit -m "chore: update coverage badge [skip ci]"
          git push
