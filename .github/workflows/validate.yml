name: Validate commit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@v4.3.0
      - name: Validate the checked-out commit
        run: mise run ci

  native:
    name: Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Run native CLI and filesystem tests
        run: go test -v ./cmd/tdx ./internal/cmd ./internal/markdown ./internal/versioning
      - name: Build and replay native executable
        shell: bash
        run: |
          binary=tdx
          if [ "$RUNNER_OS" = "Windows" ]; then binary=tdx.exe; fi
          go build -o "$binary" ./cmd/tdx
          go run ./cmd/tdx-usage -driver cli -binary "$binary" -sessions 1 -steps 40 -output dist/usage/cli
      - name: Run POSIX terminal contracts
        if: runner.os != 'Windows'
        run: python scripts/usage-pty.py --binary ./tdx
      - name: Install POSIX visual terminal test dependencies
        if: runner.os != 'Windows'
        run: python -m pip install pyte==0.8.2 wcwidth==0.8.3
      - name: Run inline terminal screen and scrollback regressions
        if: runner.os != 'Windows'
        run: python scripts/visual-pty.py --binary ./tdx
      - name: Install Windows terminal test dependency
        if: runner.os == 'Windows'
        run: python -m pip install pywinpty==3.0.2
      - name: Run Windows ConPTY smoke contracts
        if: runner.os == 'Windows'
        run: python scripts/usage-conpty.py --binary ./tdx.exe
      - name: Verify installer failures offline
        if: runner.os != 'Windows'
        run: python scripts/test_install.py
      - name: Retain native replay and terminal diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-${{ matrix.os }}-${{ github.sha }}
          path: dist/usage
          if-no-files-found: ignore
          retention-days: 14
