name: Rust feature parity
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['experiments/rust-rewrite/**', 'internal/**', 'cmd/**', '.github/workflows/rust-parity.yml']
permissions:
  contents: read
jobs:
  parity:
    name: Native parity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install Rust and Windows terminal test adapter
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
          rustup default 1.98.1
          if [ "$RUNNER_OS" = Windows ]; then python -m pip install pywinpty==3.0.2; fi
      - name: Native builds and regression tests
        run: |
          mkdir -p dist/rust-rewrite
          go test ./...
          go build -trimpath -o dist/rust-rewrite/tdx-go.exe ./cmd/tdx
          go build -o dist/rust-rewrite/go-parity.exe ./experiments/rust-rewrite/go-parity
          cargo fmt --manifest-path experiments/rust-rewrite/Cargo.toml --check
          cargo clippy --locked --manifest-path experiments/rust-rewrite/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path experiments/rust-rewrite/Cargo.toml
          python -m unittest discover -s experiments/rust-rewrite -p 'test_*.py'
          cargo build --release --locked --manifest-path experiments/rust-rewrite/Cargo.toml --bins
      - name: Full executable parity and native terminal
        env:
          PYTHONUTF8: '1'
        run: |
          ext=""
          if [ "$RUNNER_OS" = Windows ]; then ext=".exe"; fi
          python experiments/rust-rewrite/native_check.py --go dist/rust-rewrite/tdx-go.exe --rust "experiments/rust-rewrite/target/release/tdx-rust$ext" --go-adapter dist/rust-rewrite/go-parity.exe --rust-adapter "experiments/rust-rewrite/target/release/parity$ext" --output dist/rust-rewrite/native
      - name: Retain native parity evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rust-parity-${{ matrix.os }}
          path: dist/rust-rewrite/native
