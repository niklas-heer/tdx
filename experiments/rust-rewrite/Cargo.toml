[package]
name = "tdx-rust"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "tdx-rust"

[dependencies]
pulldown-cmark = { version = "=0.13.4", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
regex = "=1.13.1"
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock", "serde"] }
serde_yaml_ng = "=0.10.0"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
# Poll-based Unix input avoids the simultaneous resize/input stall seen in PTY tests.
crossterm = { version = "=0.29.0", features = ["use-dev-tty"] }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29"] }

rusqlite = { version = "=0.40.2", features = ["bundled"] }
zstd = { version = "=0.13.3", default-features = false }
toml = "=1.1.4"

unicode-width = "=0.2.2"
similar = { version = "=2.7.0", features = ["inline"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
