default_job = "clippy"

[jobs.clippy]
command = ["cargo", "clippy", "--locked", "--all-targets", "--all-features", "--", "-D", "warnings"]
need_stdout = false

[jobs.check]
command = ["cargo", "check", "--locked", "--all-targets", "--all-features"]
need_stdout = false

[jobs.test]
command = ["cargo", "nextest", "run", "--locked", "--all-targets", "--all-features", "--color", "always"]
need_stdout = true
analyzer = "nextest"
