[task_config]
shell = "bash -e -o pipefail -c"

[tools]
rust = "nightly-2026-09-05"
go = "1.27.1"

[tasks.setup]
description = "Install project tools and download Go modules"
run = ["mise install --include-task-tools", "rustup show active-toolchain", "go mod download"]

[tasks.build]
description = "Build tdx with version metadata"
run = "bash scripts/build.sh"

[tasks.install]
description = "Install tdx to ~/.local/bin (override with TDX_INSTALL_DIR)"
depends = ["build"]
run = '''
install_dir="${TDX_INSTALL_DIR:-$HOME/.local/bin}"
mkdir -p "$install_dir"
install -m 755 tdx "$install_dir/tdx"
printf 'Installed %s/tdx; ensure this directory is on PATH.\n' "$install_dir"
'''

[tasks.uninstall]
description = "Remove the user-local tdx installation"
run = 'rm -f "${TDX_INSTALL_DIR:-$HOME/.local/bin}/tdx"'

[tasks.dev]
description = "Build and run tdx; arguments follow --"
alias = ["tui"]
depends = ["build"]
run = './tdx "$@"'

[tasks.test]
description = "Run all application tests"
run = "bash scripts/test.sh"

[tasks."test:race"]
description = "Run tests with the race detector"
run = "bash scripts/test.sh --race"

[tasks.fmt]
description = "Format Go source"
run = "gofmt -w cmd internal experiments .dagger/main.go .dagger/pipeline"

[tasks."fmt:check"]
description = "Verify Go formatting"
run = 'files=$(gofmt -l cmd internal experiments .dagger/main.go .dagger/pipeline); test -z "$files" || { printf "%s\n" "$files"; exit 1; }'

[tasks.vet]
description = "Run Go static checks"
run = "go vet ./..."

[tasks.lint]
description = "Run pinned golangci-lint"
tools.golangci-lint = "2.13.2"
run = "golangci-lint run --timeout=5m"

[tasks."ci-workflows"]
description = "Validate GitHub Actions workflows"
tools.actionlint = "1.7.12"
run = "actionlint .github/workflows/*.yml"

[tasks."test:pipeline"]
description = "Test portable build and release logic"
dir = ".dagger"
run = "go test ./pipeline"

[tasks.check]
description = "Run formatting, vet, lint, tests, and workflow validation"
run = [{ task = "fmt:check" }, { task = "vet" }, { task = "lint" }, { task = "test" }, { task = "test:pipeline" }, { task = "test:release-notes" }, { task = "ci-workflows" }]

[tasks.ci]
description = "Run full portable CI in Dagger (requires Docker)"
tools.dagger = "0.21.9"
run = "dagger call ci --source=."

[tasks."ci-lint"]
description = "Run portable lint in Dagger"
tools.dagger = "0.21.9"
run = "dagger call lint --source=."

[tasks."ci-test"]
description = "Run portable race tests in Dagger"
tools.dagger = "0.21.9"
run = "dagger call test --source=."

[tasks."release-artifacts"]
description = "Build all five release binaries into dist/"
alias = ["build-all"]
tools.dagger = "0.21.9"
run = "dagger call release-artifacts --source=. export --path=dist --wipe"

[tasks.release]
description = "Validate and publish the configured release version"
run = "bash scripts/release.sh"

[tasks.clean]
description = "Remove local build artifacts"
run = "rm -f tdx; rm -rf dist"

[tasks.status]
description = "Show Git worktree status"
run = "git status --short"

[tasks."update-homebrew"]
description = "Update the Homebrew formula for a released version"
run = './scripts/update-homebrew.sh "$@"'

[tasks.help]
description = "Show tdx CLI help"
depends = ["build"]
run = "./tdx help"

[tasks.list]
description = "List todos in the current directory"
alias = ["l"]
depends = ["build"]
run = './tdx list "$@"'

[tasks.add]
description = "Add a todo"
alias = ["a"]
depends = ["build"]
run = './tdx add "$@"'

[tasks.toggle]
description = "Toggle a todo by index"
alias = ["t"]
depends = ["build"]
run = './tdx toggle "$@"'

[tasks.edit]
description = "Edit a todo by index"
alias = ["e"]
depends = ["build"]
run = './tdx edit "$@"'

[tasks.delete]
description = "Delete a todo by index"
alias = ["d"]
depends = ["build"]
run = './tdx delete "$@"'

[tasks."show-file"]
description = "Display todo.md"
run = "cat todo.md"

[tasks.demo]
description = "Try tdx with disposable project, config, and history data"
depends = ["build"]
run = 'bash scripts/demo.sh "$@"'

[tasks.coverage]
description = "Run tests and generate coverage reports in dist/coverage"
run = """
mkdir -p dist/coverage
go test -coverprofile=dist/coverage/coverage.out ./...
go tool cover -func=dist/coverage/coverage.out
go tool cover -html=dist/coverage/coverage.out -o dist/coverage/index.html
printf 'Open dist/coverage/index.html in your browser.\n'
"""

[tasks.rust-eval]
description = "Compare Go and the isolated Rust parser prototype; write profiles/results to dist/rust-eval"
tools.rust = "1.98.1"
tools.python = "3.14.7"
run = "python3 experiments/rust-eval/evaluate.py"

[tasks."rust:check"]
description = "Check formatting, lint, and tests for the Rust experiment"
tools.rust = "1.98.1"
run = """
cargo fmt --manifest-path experiments/rust-eval/rust-probe/Cargo.toml --check
CARGO_TARGET_DIR="$PWD/dist/rust-eval/target" cargo clippy --locked --manifest-path experiments/rust-eval/rust-probe/Cargo.toml -- -D warnings
CARGO_TARGET_DIR="$PWD/dist/rust-eval/target" cargo test --locked --manifest-path experiments/rust-eval/rust-probe/Cargo.toml
"""

[tasks."test:usage"]
description = "Replay 100 simulated hours (36,000 actions); retain traces and results in dist/usage"
run = 'go run ./cmd/tdx-usage "$@"'

[tasks."test:usage-cli"]
description = "Exercise the real executable against independent task-state traces"
depends = ["build"]
run = 'go run ./cmd/tdx-usage -driver cli -binary ./tdx -sessions 2 -steps 100 -output dist/usage/cli "$@"'

[tasks."test:terminal"]
description = "Run real PTY contracts for editing, Unicode, history, resizing and read-only mode (macOS/Linux)"
depends = ["build"]
tools.python = "3.14.7"
run = 'python3 scripts/usage-pty.py "$@"'

[tasks."profile:usage"]
description = "Profile bounded TUI sessions and checkbox edits; write CPU/heap profiles to dist/usage/profile"
run = """
mkdir -p dist/usage/profile
go test ./internal/usage -run TestSeededSessions -count=1 -cpuprofile=dist/usage/profile/cpu.pprof -memprofile=dist/usage/profile/heap.pprof -o dist/usage/profile/usage.test
go test ./internal/markdown -run '^$' -bench BenchmarkLoadedCheckbox -benchmem -count=3
"""

[tasks."test:release-notes"]
description = "Verify reviewed release notes offline"
tools.python = "3.14.7"
run = "bash scripts/test_release_notes.sh"

[tasks.rust-rewrite]
description = "Run the experimental Rust CLI/TUI (isolated from production Go)"
tools.rust = "nightly-2026-09-05"
run = 'CARGO_TARGET_DIR="$PWD/dist/rust-rewrite/target" cargo run --release --locked --manifest-path experiments/rust-rewrite/Cargo.toml -- "$@"'

[tasks."rust-rewrite:check"]
description = "Check all Rust targets/features, strict Clippy, nextest, docs and harness regressions"
tools.rust = "nightly-2026-09-05"
tools.python = "3.14.7"
tools."cargo:cargo-nextest" = "0.9.143"
run = """
export CARGO_TARGET_DIR="$PWD/dist/rust-rewrite/target"
cargo fmt --all --manifest-path experiments/rust-rewrite/Cargo.toml --check
cargo check --locked --all-targets --all-features --manifest-path experiments/rust-rewrite/Cargo.toml
cargo clippy --locked --all-targets --all-features --manifest-path experiments/rust-rewrite/Cargo.toml -- -D warnings
cargo nextest run --locked --all-targets --all-features --manifest-path experiments/rust-rewrite/Cargo.toml
RUSTDOCFLAGS='-D warnings' cargo doc --locked --all-features --no-deps --document-private-items --manifest-path experiments/rust-rewrite/Cargo.toml
python3 -m unittest discover -s experiments/rust-rewrite -p 'test_*.py'
"""

[tasks."rust-rewrite:stable"]
description = "Compile and test the rewrite on its supported stable Rust floor"
tools.rust = "1.98.1"
run = """
export CARGO_TARGET_DIR="$PWD/dist/rust-rewrite/stable-target"
cargo check --locked --all-targets --all-features --manifest-path experiments/rust-rewrite/Cargo.toml
cargo test --locked --all-features --manifest-path experiments/rust-rewrite/Cargo.toml
"""

[tasks."rust-rewrite:watch"]
description = "Continuous Rust checks with Bacon; c/check and t/nextest, without running the application"
tools.rust = "nightly-2026-09-05"
tools."cargo:bacon" = "3.25.0"
tools."cargo:cargo-nextest" = "0.9.143"
run = 'CARGO_TARGET_DIR="$PWD/dist/rust-rewrite/target" bacon experiments/rust-rewrite "$@"'

[tasks."rust-rewrite:miri"]
description = "Interpret pure document, input, console decoder and presentation tests with Miri"
tools.rust = "nightly-2026-09-05"
run = """
export CARGO_TARGET_DIR="$PWD/dist/rust-rewrite/miri-target"
export MIRIFLAGS='-Zmiri-strict-provenance'
cargo miri setup
for group in actions::tests document::tests input::tests console_input::tests presentation::tests save_protocol::tests source_buffer::tests; do
  filters=()
  if [ "$group" = input::tests ]; then filters=(--skip console_input::tests); fi
  cargo miri test --locked --manifest-path experiments/rust-rewrite/Cargo.toml --bin tdx-rust "$group" -- "${filters[@]}"
done
"""

[tasks."rust-rewrite:contracts"]
description = "Compare Go/Rust CLI, replay, history interoperability and real-terminal recovery contracts"
tools.rust = "nightly-2026-09-05"
tools.python = "3.14.7"
run = """
go build -trimpath -ldflags='-s -w' -o dist/rust-rewrite/tdx-go ./cmd/tdx
go build -o dist/rust-rewrite/tdx-usage ./cmd/tdx-usage
go build -o dist/rust-rewrite/go-history ./experiments/rust-rewrite/go-history
CARGO_TARGET_DIR="$PWD/dist/rust-rewrite/target" cargo build --release --locked --manifest-path experiments/rust-rewrite/Cargo.toml
go build -o dist/rust-rewrite/go-parity ./experiments/rust-rewrite/go-parity
python3 experiments/rust-rewrite/parity_contracts.py --rust dist/rust-rewrite/target/release/parity
python3 experiments/rust-rewrite/application_contracts.py --rust dist/rust-rewrite/target/release/tdx-rust
python3 experiments/rust-rewrite/contracts.py
python3 experiments/rust-rewrite/markdown_check.py --binary dist/rust-rewrite/target/release/tdx-rust --output dist/rust-rewrite/markdown-terminal
"""

[tasks."rust-rewrite:eval"]
description = "Measure correctness-gated Rust CLI/TUI rewrite comparison, including fresh builds"
tools.rust = "nightly-2026-09-05"
tools.python = "3.14.7"
run = 'python3 experiments/rust-rewrite/evaluate.py "$@"'

[tasks."rust-rewrite:gallery"]
description = "Export actual Ratatui screen buffers as a visual review gallery"
tools.rust = "nightly-2026-09-05"
tools.python = "3.14.7"
run = """
TDX_GALLERY_DIR="$PWD/dist/rust-rewrite/gallery" CARGO_TARGET_DIR="$PWD/dist/rust-rewrite/target" cargo test --locked --manifest-path experiments/rust-rewrite/Cargo.toml --bin tdx-rust tui::tests::export_ratatui_gallery -- --ignored --exact
python3 experiments/rust-rewrite/render_gallery.py dist/rust-rewrite/gallery
"""

[tasks."rust-rewrite:simulate"]
description = "Deterministic save faults, replay, recovery and negative controls"
tools.rust = "nightly-2026-09-05"
tools.python = "3.14.7"
run = """
CARGO_TARGET_DIR="$PWD/dist/rust-rewrite/target" cargo build --release --locked --manifest-path experiments/rust-rewrite/Cargo.toml --bin simulate
python3 experiments/rust-rewrite/simulation_check.py --binary dist/rust-rewrite/target/release/simulate --output dist/rust-rewrite/simulation "$@"
"""
